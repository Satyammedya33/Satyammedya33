<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1424"/>
    </linearGradient>
    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2dd4bf" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bgGrad)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- circuit traces -->
  <g stroke="#2dd4bf" stroke-opacity="0.18" stroke-width="1.4" fill="none">
    <path d="M0 40 H180 L210 70 H420"/>
    <path d="M0 220 H150 L180 190 H520"/>
    <path d="M1200 60 H980 L950 90 H760"/>
    <path d="M1200 205 H1010 L985 180 H840"/>
  </g>
  <g fill="#8b5cf6" fill-opacity="0.45">
    <circle cx="210" cy="70" r="2.6"/><circle cx="420" cy="70" r="2.6"/>
    <circle cx="180" cy="190" r="2.6"/><circle cx="950" cy="90" r="2.6"/>
    <circle cx="985" cy="180" r="2.6"/>
  </g>

  <!-- chip emblem, left -->
  <g transform="translate(70,70) scale(0.46)">
    <polygon points="200,108 274,150 274,234 200,276 126,234 126,150"
             fill="#0d1117" stroke="url(#text)" stroke-width="6" filter="url(#soft)"/>
    <polygon points="200,132 253,163 253,221 200,252 147,221 147,163"
             fill="none" stroke="url(#text)" stroke-width="2" stroke-opacity="0.6"/>
    <g stroke="url(#text)" stroke-width="3.4" stroke-linecap="round">
      <line x1="172" y1="204" x2="200" y2="176"/>
      <line x1="200" y1="176" x2="230" y2="196"/>
      <line x1="200" y1="176" x2="200" y2="150"/>
      <line x1="172" y1="204" x2="172" y2="234"/>
      <line x1="230" y1="196" x2="230" y2="228"/>
    </g>
    <g fill="#08090d" stroke="url(#text)" stroke-width="3.6">
      <circle cx="200" cy="150" r="9"/><circle cx="200" cy="176" r="10"/>
      <circle cx="172" cy="204" r="9"/><circle cx="230" cy="196" r="9"/>
      <circle cx="172" cy="234" r="9"/><circle cx="230" cy="228" r="9"/>
    </g>
    <circle cx="200" cy="192" r="150" fill="none" stroke="#2dd4bf" stroke-width="1.4" stroke-opacity="0.3">
      <animate attributeName="r" values="140;160;140" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.3;0.03;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- name + role -->
  <text x="235" y="112" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="44"
        font-weight="bold" letter-spacing="2" fill="url(#text)">SATYAM MEDYA</text>

  <text x="237" y="148" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="18"
        fill="#8b93a7">Data Engineer &#183; AI/LLM Safety &#183; Applied Security</text>

  <!-- terminal line -->
  <text x="237" y="188" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="16" fill="#2dd4bf">
    <tspan fill="#8b5cf6">$</tspan> build --pipelines kafka,airflow,aws --gate data-quality --redteam llm<tspan fill="#2dd4bf">_</tspan>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.75;0.85;1" dur="1.4s" repeatCount="indefinite"/>
  </text>

  <!-- bottom accent -->
  <rect x="0" y="248" width="1200" height="2" fill="url(#line)"/>
  <rect x="0" y="248" width="1200" height="2" fill="url(#line)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>
</svg>
