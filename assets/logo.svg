<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#151b2e"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#08090d"/>
    </radialGradient>
    <linearGradient id="chip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="chipSoft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- faint circuit grid -->
  <g stroke="#2dd4bf" stroke-opacity="0.10" stroke-width="1.4">
    <path d="M40 120 H140 M40 280 H140 M260 120 H360 M260 280 H360"/>
    <path d="M120 40 V140 M280 40 V140 M120 260 V360 M280 260 V360"/>
  </g>
  <g fill="#8b5cf6" fill-opacity="0.35">
    <circle cx="40" cy="120" r="3"/><circle cx="40" cy="280" r="3"/>
    <circle cx="360" cy="120" r="3"/><circle cx="360" cy="280" r="3"/>
    <circle cx="120" cy="40" r="3"/><circle cx="280" cy="40" r="3"/>
    <circle cx="120" cy="360" r="3"/><circle cx="280" cy="360" r="3"/>
  </g>

  <!-- chip pins -->
  <g stroke="url(#chipSoft)" stroke-width="6" stroke-linecap="round">
    <line x1="200" y1="78" x2="200" y2="108"/>
    <line x1="200" y1="292" x2="200" y2="322"/>
    <line x1="78" y1="200" x2="108" y2="200"/>
    <line x1="292" y1="200" x2="322" y2="200"/>
    <line x1="126" y1="126" x2="146" y2="146"/>
    <line x1="254" y1="126" x2="274" y2="146"/>
    <line x1="126" y1="274" x2="146" y2="254"/>
    <line x1="254" y1="274" x2="274" y2="254"/>
  </g>
  <g fill="#0d1117" stroke="url(#chip)" stroke-width="2.5">
    <circle cx="200" cy="78" r="5"/><circle cx="200" cy="322" r="5"/>
    <circle cx="78" cy="200" r="5"/><circle cx="322" cy="200" r="5"/>
    <circle cx="126" cy="126" r="5"/><circle cx="274" cy="146" r="5"/>
    <circle cx="126" cy="274" r="5"/><circle cx="274" cy="254" r="5"/>
  </g>

  <!-- hexagonal chip body -->
  <polygon points="200,108 274,150 274,234 200,276 126,234 126,150"
           fill="#0d1117" stroke="url(#chip)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="200,132 253,163 253,221 200,252 147,221 147,163"
           fill="none" stroke="url(#chip)" stroke-width="1.4" stroke-opacity="0.55"/>

  <!-- data-node graph inside the chip: engineer's signature mark -->
  <g stroke="url(#chip)" stroke-width="2.4" stroke-linecap="round" opacity="0.95">
    <line x1="172" y1="204" x2="200" y2="176"/>
    <line x1="200" y1="176" x2="230" y2="196"/>
    <line x1="200" y1="176" x2="200" y2="150"/>
    <line x1="172" y1="204" x2="172" y2="234"/>
    <line x1="230" y1="196" x2="230" y2="228"/>
  </g>
  <g fill="#08090d" stroke="url(#chip)" stroke-width="2.6">
    <circle cx="200" cy="150" r="7"/>
    <circle cx="200" cy="176" r="8"/>
    <circle cx="172" cy="204" r="7"/>
    <circle cx="230" cy="196" r="7"/>
    <circle cx="172" cy="234" r="7"/>
    <circle cx="230" cy="228" r="7"/>
  </g>

  <!-- subtle pulse ring for life -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.25">
    <animate attributeName="r" values="150;168;150" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.25;0.02;0.25" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- monogram -->
  <text x="200" y="360" text-anchor="middle" font-family="DejaVu Sans Mono, Consolas, monospace"
        font-size="22" letter-spacing="6" fill="url(#chip)" font-weight="bold">SM</text>
</svg>
